name: Deploy PoC to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'poc/google-maps-share-link/**'
      - 'functions/**'
      - 'tests/**'
      - 'docs/CLOUDFLARE_SETUP.md'
      - 'docs/02_SYSTEM_ARCHITECTURE.md'
      - 'docs/03_APPLICATION_ARCHITECTURE.md'
      - 'docs/adr/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PoC and Function files
        shell: bash
        run: |
          set -euo pipefail
          test -s poc/google-maps-share-link/index.html
          test -s poc/google-maps-share-link/server-poc-v2.html
          test -s poc/google-maps-share-link/resolver.mjs
          test -s functions/api/resolve-map.js
          test -s functions/_shared/google-maps-resolver.js
          node --check poc/google-maps-share-link/resolver.mjs
          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js

      - name: Run resolver tests
        shell: bash
        run: |
          set -euo pipefail
          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs

      - name: Write Pages build marker
        shell: bash
        run: |
          printf '{"buildSha":"%s"}\n' "$GITHUB_SHA" > poc/google-maps-share-link/build.json

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          preCommands: npx wrangler pages project create omoi-no-hougaku --production-branch main || true
          command: pages deploy poc/google-maps-share-link --project-name=omoi-no-hougaku --branch=main --commit-dirty=true

      - name: Deployment smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ]; then
            echo 'Wrangler did not return deployment-url.'
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 30); do
            echo "Pages readiness attempt $attempt/30: $BASE_URL"

            api_status="$(curl -sS -o /tmp/api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-map" \
              -H 'content-type: application/json' \
              --data '{}')" || api_status="000"

            if curl -fsS "$BASE_URL/build.json" -o /tmp/build.json \
              && curl -fsS "$BASE_URL/" -o /tmp/index.html \
              && curl -fsS "$BASE_URL/server-poc-v2.html" -o /tmp/server-poc-v2.html \
              && curl -fsS "$BASE_URL/resolver.mjs" -o /tmp/resolver.mjs \
              && grep -Fq "\"buildSha\":\"$EXPECTED_BUILD_SHA\"" /tmp/build.json \
              && grep -q 'Google Maps' /tmp/index.html \
              && grep -q 'Pages Function' /tmp/index.html \
              && grep -q 'SERVER RESOLVER v2' /tmp/server-poc-v2.html \
              && grep -q '/api/resolve-map' /tmp/server-poc-v2.html \
              && grep -q 'maps.app.goo.gl' /tmp/resolver.mjs \
              && [ "$api_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/api.json; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'PoC deployment did not become ready within 60 seconds.'
            exit 1
          fi
