name: Preview reset quiet mode

on:
  push:
    branches:
      - bugfix/reset-quiet-mode-on-share

permissions:
  contents: read

concurrency:
  group: preview-reset-quiet-mode
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate fix
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/js/ui/app-view.js
          grep -Fq 'resetQuietMode()' public/js/ui/app-view.js
          grep -Fq 'view.resetQuietMode();' public/app.js
          grep -Fq 'overflow-wrap: anywhere;' public/styles.css

      - name: Deploy public directory as Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: pages deploy public --project-name=omoi-no-hougaku --branch=bugfix-reset-quiet-mode --commit-dirty=true

      - name: Preview smoke test
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS "$DEPLOYMENT_URL/app.js" -o /tmp/app.js \
              && curl -fsS "$DEPLOYMENT_URL/js/ui/app-view.js" -o /tmp/app-view.js \
              && curl -fsS "$DEPLOYMENT_URL/styles.css" -o /tmp/styles.css; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -Fq 'view.resetQuietMode();' /tmp/app.js
          grep -Fq 'resetQuietMode()' /tmp/app-view.js
          grep -Fq 'overflow-wrap: anywhere;' /tmp/styles.css

      - name: Report preview URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Preview URL: $DEPLOYMENT_URL"
