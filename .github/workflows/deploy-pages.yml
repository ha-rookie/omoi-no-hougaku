name: Deploy PoC to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'poc/google-maps-share-link/**'
      - 'functions/**'
      - 'tests/**'
      - 'docs/CLOUDFLARE_SETUP.md'
      - 'docs/02_SYSTEM_ARCHITECTURE.md'
      - 'docs/03_APPLICATION_ARCHITECTURE.md'
      - 'docs/adr/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PoC and Function files
        shell: bash
        run: |
          set -euo pipefail
          test -s poc/google-maps-share-link/index.html
          test -s poc/google-maps-share-link/server-poc-v2.html
          test -s poc/google-maps-share-link/resolver.mjs
          test -s poc/google-maps-share-link/share-target-poc.html
          test -s poc/google-maps-share-link/share-target-manifest.webmanifest
          test -s poc/google-maps-share-link/sw-share-target.js
          test -s poc/google-maps-share-link/share-target-icon.svg
          test -s poc/google-maps-share-link/resolution-api-poc.html
          test -s poc/google-maps-share-link/location-poc.html
          test -s functions/api/resolve-map.js
          test -s functions/_shared/google-maps-resolver.js
          test -s functions/api/resolve-maps-url.js
          test -s functions/_shared/maps-grounding-resolver.js
          test -s functions/api/resolve-location.js
          test -s functions/_shared/places-details.js
          node --check poc/google-maps-share-link/resolver.mjs
          node --check poc/google-maps-share-link/sw-share-target.js
          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js
          node --check functions/api/resolve-maps-url.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/places-details.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('poc/google-maps-share-link/share-target-manifest.webmanifest','utf8')); if(!m.share_target || m.share_target.method !== 'POST') process.exit(1)"

      - name: Run resolver tests
        shell: bash
        run: |
          set -euo pipefail
          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs
          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs

      - name: Write Pages build marker
        shell: bash
        run: |
          printf '{"buildSha":"%s"}\n' "$GITHUB_SHA" > poc/google-maps-share-link/build.json

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          MAPS_GROUNDING_API_KEY: ${{ secrets.MAPS_GROUNDING_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          preCommands: |
            test -n "$MAPS_GROUNDING_API_KEY"
            printf '%s' "$MAPS_GROUNDING_API_KEY" | npx wrangler pages secret put MAPS_GROUNDING_API_KEY --project-name=omoi-no-hougaku
            npx wrangler pages project create omoi-no-hougaku --production-branch main || true
          command: pages deploy poc/google-maps-share-link --project-name=omoi-no-hougaku --branch=main --commit-dirty=true

      - name: Deployment smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ]; then
            echo 'Wrangler did not return deployment-url.'
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 30); do
            echo "Pages readiness attempt $attempt/30: $BASE_URL"

            api_status="$(curl -sS -o /tmp/api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-map" \
              -H 'content-type: application/json' \
              --data '{}')" || api_status="000"
            grounding_status="$(curl -sS -o /tmp/grounding-api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-maps-url" \
              -H 'content-type: application/json' \
              --data '{}')" || grounding_status="000"
            location_status="$(curl -sS -o /tmp/location-api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-location" \
              -H 'content-type: application/json' \
              --data '{}')" || location_status="000"

            if curl -fsS "$BASE_URL/build.json" -o /tmp/build.json \
              && curl -fsS "$BASE_URL/" -o /tmp/index.html \
              && curl -fsS "$BASE_URL/server-poc-v2.html" -o /tmp/server-poc-v2.html \
              && curl -fsS "$BASE_URL/resolver.mjs" -o /tmp/resolver.mjs \
              && curl -fsS "$BASE_URL/share-target-poc.html" -o /tmp/share-target-poc.html \
              && curl -fsS "$BASE_URL/share-target-manifest.webmanifest" -o /tmp/share-target-manifest.webmanifest \
              && curl -fsS "$BASE_URL/sw-share-target.js" -o /tmp/sw-share-target.js \
              && curl -fsS "$BASE_URL/resolution-api-poc.html" -o /tmp/resolution-api-poc.html \
              && curl -fsS "$BASE_URL/location-poc.html" -o /tmp/location-poc.html \
              && grep -Fq "\"buildSha\":\"$EXPECTED_BUILD_SHA\"" /tmp/build.json \
              && grep -q 'Google Maps' /tmp/index.html \
              && grep -q 'Pages Function' /tmp/index.html \
              && grep -q 'SERVER RESOLVER v2' /tmp/server-poc-v2.html \
              && grep -q '/api/resolve-map' /tmp/server-poc-v2.html \
              && grep -q 'maps.app.goo.gl' /tmp/resolver.mjs \
              && grep -q 'WEB SHARE TARGET PoC' /tmp/share-target-poc.html \
              && grep -q 'share_target' /tmp/share-target-manifest.webmanifest \
              && grep -q '/share-target' /tmp/sw-share-target.js \
              && grep -q 'MAPS GROUNDING LITE PoC' /tmp/resolution-api-poc.html \
              && grep -q 'MAPS URL → LOCATION PoC' /tmp/location-poc.html \
              && [ "$api_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/api.json \
              && [ "$grounding_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/grounding-api.json \
              && [ "$location_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/location-api.json; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'PoC deployment did not become ready within 60 seconds.'
            exit 1
          fi
