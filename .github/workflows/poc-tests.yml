name: PoC and MVP tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/**'
      - 'poc/**'
      - 'functions/**'
      - 'tests/**'
      - '.github/workflows/poc-tests.yml'

permissions:
  contents: read

concurrency:
  group: omoi-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-and-resolvers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and manifests
        run: |
          node --check public/sw.js
          node --check public/js/app.mjs
          node --check public/js/core/coordinate-validator.mjs
          node --check public/js/core/shared-payload-classifier.mjs
          node --check public/js/app/receive-shared-place.mjs
          node --check public/js/app/register-place.mjs
          node --check public/js/infrastructure/location-resolver-client.mjs
          node --check public/js/infrastructure/place-repository.mjs
          node --check poc/google-maps-share-link/resolver.mjs
          node --check poc/google-maps-share-link/share-location-resolver.mjs
          node --check poc/google-maps-share-link/sw-share-target.js
          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js
          node --check functions/api/resolve-maps-url.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/places-details.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(!m.share_target || m.share_target.method !== 'POST' || m.share_target.action !== '/share-target') process.exit(1)"
          grep -Fq "navigator.serviceWorker.register('/sw.js'" public/js/app.mjs
          grep -Fq "event.request.method !== 'POST'" public/sw.js
          grep -Fq "navigator.serviceWorker.register('/sw-share-target.js'" poc/google-maps-share-link/share-location-poc.html
          grep -Fq "await navigator.serviceWorker.ready" poc/google-maps-share-link/share-location-poc.html
          if grep -R "from .*poc/\|import .*poc/" public; then
            echo 'Production code must not import PoC code.'
            exit 1
          fi
      - name: Run tests
        run: |
          node tests/production-place-registration.test.mjs
          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs
          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs
          node tests/share-location-resolver.test.mjs
      - name: Write preview build marker
        if: github.event_name == 'pull_request'
        run: printf '{"buildSha":"%s"}\n' "$GITHUB_SHA" > public/build.json
      - name: Deploy MVP Preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        env:
          MAPS_GROUNDING_API_KEY: ${{ secrets.MAPS_GROUNDING_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          preCommands: |
            test -n "$MAPS_GROUNDING_API_KEY"
            printf '%s' "$MAPS_GROUNDING_API_KEY" | npx wrangler pages secret put MAPS_GROUNDING_API_KEY --project-name=omoi-no-hougaku --env preview
            npx wrangler pages secret list --project-name=omoi-no-hougaku --env preview | grep -q 'MAPS_GROUNDING_API_KEY'
          command: pages deploy public --project-name=omoi-no-hougaku --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
      - name: Show preview URL
        if: github.event_name == 'pull_request'
        run: |
          echo "Preview URL: ${{ steps.preview.outputs.deployment-url }}"
