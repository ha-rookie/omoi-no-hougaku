name: Deploy Rate Limiter Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/api-rate-limiter/**'
      - 'tests/rate-limiter-worker.test.mjs'
      - '.github/workflows/deploy-rate-limiter.yml'

permissions:
  contents: read

concurrency:
  group: production-rate-limiter-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate worker files
        shell: bash
        run: |
          set -euo pipefail
          test -s workers/api-rate-limiter/src/index.js
          test -s workers/api-rate-limiter/wrangler.jsonc
          test -s tests/rate-limiter-worker.test.mjs
          node --check workers/api-rate-limiter/src/index.js
          node --check tests/rate-limiter-worker.test.mjs
          node tests/rate-limiter-worker.test.mjs

      - name: Deploy private rate limiter Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --config workers/api-rate-limiter/wrangler.jsonc
