<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <meta name="description" content="大切な人や場所の方角を、静かに向くためのWebアプリ">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <title>想いの方角</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f5f5f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 56px; }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    p { line-height: 1.7; }
    .lead { color: #555; margin-top: 8px; }
    .card { margin-top: 18px; padding: 18px; border: 1px solid #ddd; border-radius: 18px; background: #fff; }
    .muted { color: #666; font-size: .92rem; }
    .status { min-height: 1.5em; font-weight: 700; }
    .status.error { color: #a12622; }
    .status.ok { color: #176b39; }
    .coords { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    label { display: block; font-weight: 700; margin-top: 14px; }
    input { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid #aaa; border-radius: 10px; font: inherit; }
    button, .button-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .primary { background: #222; color: #fff; }
    .secondary { background: #eee; color: #222; }
    .danger { background: #f1e6e6; color: #8d1f1f; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    ul { list-style: none; margin: 0; padding: 0; }
    .place { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid #eee; }
    .place:first-child { border-top: 0; }
    .place-name { font-weight: 800; overflow-wrap: anywhere; }
    .place-meta { margin-top: 4px; color: #666; font-size: .86rem; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>想いの方角</h1>
      <p class="lead">大切な場所を少しだけ登録して、その方角を向くための静かな道具です。</p>
    </header>

    <section class="card">
      <h2>場所を追加</h2>
      <p>Google Mapsで場所を選び、共有先から「想いの方角」を選んでください。</p>
      <div class="actions">
        <a class="button-link secondary" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Google Mapsを開く</a>
      </div>
      <p class="muted">任意ピンの座標は端末内で処理します。施設名などの共有は、場所を確認するためGoogle公式APIへ共有URLを送る場合があります。</p>
    </section>

    <section id="candidate-card" class="card" hidden>
      <h2>この場所を登録</h2>
      <p id="candidate-coordinates" class="coords"></p>
      <form id="place-form">
        <label for="place-name">自分だけの名前</label>
        <input id="place-name" name="place-name" maxlength="40" autocomplete="off" required>
        <div class="actions">
          <button class="primary" type="submit">保存する</button>
          <button id="cancel-candidate" class="secondary" type="button">やめる</button>
        </div>
      </form>
      <p id="candidate-note" class="muted"></p>
    </section>

    <section class="card">
      <h2>保存した場所 <span id="place-count" class="muted"></span></h2>
      <div id="saved-empty" class="muted">まだ保存した場所はありません。</div>
      <ul id="saved-list"></ul>
    </section>

    <section class="card" aria-live="polite">
      <h2>状態</h2>
      <div id="status" class="status">共有待ちです。</div>
    </section>
  </main>

  <script type="module" src="/js/app.mjs"></script>
</body>
</html>
