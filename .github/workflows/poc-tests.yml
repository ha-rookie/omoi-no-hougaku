name: PoC tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: omoi-poc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  google-maps-share-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check poc/google-maps-share-link/resolver.mjs
          node --check poc/google-maps-share-link/share-location-resolver.mjs
          node --check poc/google-maps-share-link/sw-share-target.js
          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js
          node --check functions/api/resolve-maps-url.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/places-details.js
          node --check functions/_shared/request-security.js
          node --check functions/_shared/rate-limit-service.js
          node --check workers/api-rate-limiter/src/index.js
          node --check tests/request-security.test.mjs
          node --check tests/rate-limiter-worker.test.mjs
          node --check tests/rate-limit-service.test.mjs
          grep -Fq "navigator.serviceWorker.register('/sw-share-target.js'" poc/google-maps-share-link/share-location-poc.html
          grep -Fq "await navigator.serviceWorker.ready" poc/google-maps-share-link/share-location-poc.html
      - name: Run resolver tests
        run: |
          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs
          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs
          node tests/share-location-resolver.test.mjs
          node tests/request-security.test.mjs
          node tests/rate-limiter-worker.test.mjs
          node tests/rate-limit-service.test.mjs
