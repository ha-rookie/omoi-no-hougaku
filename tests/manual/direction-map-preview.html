<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f4">
  <title>想いの方角 Preview Test Setup</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f4;
      color: #262626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: #fff;
      border: 1px solid #d6d3d1;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
    }
    button, a {
      min-height: 46px;
      border-radius: 999px;
      padding: 11px 16px;
      border: 1px solid #3f3f46;
      background: #fff;
      color: #27272a;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary {
      background: #27272a;
      color: #fff;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .muted { color: #626262; line-height: 1.65; }
    #status { min-height: 1.5em; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Previewテスト準備</h1>
  <p class="muted">
    Google Mapsから共有したり、PWAを入れ直したりせず、
    Preview専用のテスト地点を端末内に用意します。
  </p>

  <section class="card">
    <h2>地図テスト地点</h2>
    <p class="muted">
      Preview側の保存地点だけを初期化して、国内確認用「東京」と海外確認用「ホノルル」を登録します。
      本番サイトのlocalStorageには影響しません。
    </p>
    <div class="actions">
      <button id="prepare" class="primary" type="button">テスト地点を準備してアプリを開く</button>
      <a href="/">そのままアプリを開く</a>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>用意される地点</h2>
    <p>国内確認：東京</p>
    <p>海外確認：ホノルル</p>
    <p class="muted">
      アプリを開いたら登録一覧の「この場所を見る」を押すとコンパスが表示されます。そのまま「地図」へ切り替えて確認できます。
    </p>
  </section>
</main>

<script type="module">
  import { PlaceRepository } from '/js/infrastructure/place-repository.js';

  const status = document.querySelector('#status');
  const button = document.querySelector('#prepare');

  button.addEventListener('click', () => {
    try {
      const repository = new PlaceRepository();

      for (const place of repository.list()) {
        repository.remove(place.id);
      }

      repository.save({
        name: '東京（国内テスト）',
        latitude: 35.681236,
        longitude: 139.767125,
      });

      repository.save({
        name: 'ホノルル（海外テスト）',
        latitude: 21.3069,
        longitude: -157.8583,
      });

      status.textContent = 'テスト地点を準備しました。アプリへ移動します…';
      window.location.assign('/');
    } catch (error) {
      status.textContent =
        error?.message ?? 'テスト地点を準備できませんでした。';
    }
  });
</script>
</body>
</html>
