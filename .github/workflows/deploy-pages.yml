name: Deploy MVP to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate MVP and Function files
        shell: bash
        run: |
          set -euo pipefail

          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          test -s public/manifest.webmanifest
          test -s public/robots.txt
          test -s public/sitemap.xml
          test -s public/sw.js
          test -s public/assets/app-icon.svg
          test -s public/assets/backgrounds/omoi-no-hougaku-bg-morning-mist-beige.png
          test -s public/js/ui/app-view.js
          test -s public/js/ui/map-overview.js
          test -s public/js/app/receive-shared-place.js
          test -s public/js/app/register-place.js
          test -s public/js/app/direction-session.js
          test -s public/js/infrastructure/location-resolver-client.js
          test -s public/js/infrastructure/place-repository.js
          test -s public/js/infrastructure/internal-test-mode.js
          test -s functions/api/resolve-location.js
          test -s functions/_shared/maps-grounding-resolver.js
          test -s functions/_shared/places-details.js
          test -s functions/_shared/request-security.js
          test -s functions/_shared/rate-limit-service.js

          node --check public/app.js
          node --check public/sw.js
          node --check public/js/ui/app-view.js
          node --check public/js/ui/map-overview.js
          node --check public/js/app/receive-shared-place.js
          node --check public/js/app/register-place.js
          node --check public/js/app/direction-session.js
          node --check public/js/infrastructure/location-resolver-client.js
          node --check public/js/infrastructure/place-repository.js
          node --check public/js/infrastructure/internal-test-mode.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/_shared/places-details.js
          node --check functions/_shared/request-security.js
          node --check functions/_shared/rate-limit-service.js

          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(!m.share_target || m.share_target.method !== 'POST' || m.share_target.action !== '/share-target') process.exit(1)"
          grep -Fq "navigator.serviceWorker.register('/sw.js'" public/app.js
          grep -Fq "requestUrl.pathname === '/share-target'" public/sw.js
          grep -Fq "document.documentElement.dataset.internalTest" public/app.js
          grep -Fq 'omoi-no-hougaku-bg-morning-mist-beige.png' public/styles.css
          grep -Fq '<link rel="canonical" href="https://omoi-no-hougaku.pages.dev/">' public/index.html
          grep -Fq 'Sitemap: https://omoi-no-hougaku.pages.dev/sitemap.xml' public/robots.txt
          grep -Fq '<loc>https://omoi-no-hougaku.pages.dev/</loc>' public/sitemap.xml

          if grep -R -E "from ['\"][^'\"]*poc/|import\(['\"][^'\"]*poc/" public --include='*.js'; then
            echo 'Production code must not import from poc/.'
            exit 1
          fi

      - name: Run production regression tests
        shell: bash
        run: |
          set -euo pipefail

          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs
          node tests/request-security.test.mjs
          node tests/rate-limit-service.test.mjs
          node tests/shared-location.test.mjs
          node tests/receive-shared-place.test.mjs
          node tests/place-repository.test.mjs
          node tests/location-resolver-client.test.mjs
          node tests/direction-core.test.mjs
          node tests/direction-session.test.mjs
          node --test tests/heading-provider.test.mjs
          node --test tests/wmm2025-runtime.test.mjs
          node tests/map-geometry.test.mjs
          node tests/alignment-transition.test.mjs
          node tests/internal-test-mode.test.mjs

      - name: Configure and verify Pages rate limiter service binding
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/omoi-no-hougaku"
          curl -fsS "$API_URL" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' -o /tmp/pages-project-before.json
          jq -e '.success == true' /tmp/pages-project-before.json >/dev/null
          jq '{deployment_configs:{production:{services:((.result.deployment_configs.production.services // {}) + {RATE_LIMITER_SERVICE:{service:"omoi-no-hougaku-rate-limiter"}})}}}' /tmp/pages-project-before.json > /tmp/pages-project-patch.json
          curl -fsS -X PATCH "$API_URL" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/pages-project-patch.json -o /tmp/pages-project-after.json
          jq -e '.success == true and .result.deployment_configs.production.services.RATE_LIMITER_SERVICE.service == "omoi-no-hougaku-rate-limiter"' /tmp/pages-project-after.json >/dev/null

      - name: Write Pages build marker
        shell: bash
        run: |
          printf '{"buildSha":"%s"}\n' "$GITHUB_SHA" > public/build.json

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          MAPS_GROUNDING_API_KEY: ${{ secrets.MAPS_GROUNDING_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          preCommands: |
            test -n "$MAPS_GROUNDING_API_KEY"
            printf '%s' "$MAPS_GROUNDING_API_KEY" | npx wrangler pages secret put MAPS_GROUNDING_API_KEY --project-name=omoi-no-hougaku
            npx wrangler pages project create omoi-no-hougaku --production-branch main || true
          command: pages deploy public --project-name=omoi-no-hougaku --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Production smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          BASE_URL: https://omoi-no-hougaku.pages.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo 'Wrangler did not return deployment-url.'
            exit 1
          fi

          echo "Wrangler deployment URL: $DEPLOYMENT_URL"
          echo "Production smoke target: $BASE_URL"

          ORIGIN="${BASE_URL%/}"
          ready=0
          for attempt in $(seq 1 30); do
            echo "Pages readiness attempt $attempt/30: $BASE_URL"

            no_origin_status="$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-location" \
              -H 'content-type: application/json' \
              --data '{}')" || no_origin_status="000"

            location_status="$(curl -sS -o /tmp/location-api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-location" \
              -H 'content-type: application/json' \
              -H "Origin: $ORIGIN" \
              -H 'Sec-Fetch-Site: same-origin' \
              --data '{}')" || location_status="000"

            build_ok=0
            if curl -fsS "$BASE_URL/build.json" -o /tmp/build.json; then
              if grep -Fq "\"buildSha\":\"$EXPECTED_BUILD_SHA\"" /tmp/build.json; then
                build_ok=1
              fi
            fi

            root_ok=0
            manifest_ok=0
            sw_ok=0
            background_ok=0
            robots_ok=0
            sitemap_ok=0

            if curl -fsS "$BASE_URL/" -o /tmp/index.html && grep -Fq '想いの方角' /tmp/index.html; then
              root_ok=1
            fi

            if curl -fsS "$BASE_URL/manifest.webmanifest" -o /tmp/manifest.json \
              && node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8')); if(!m.share_target || m.share_target.action !== '/share-target' || m.share_target.method !== 'POST') process.exit(1)"; then
              manifest_ok=1
            fi

            if curl -fsS "$BASE_URL/sw.js" -o /tmp/sw.js && grep -Fq "/share-target" /tmp/sw.js; then
              sw_ok=1
            fi

            if curl -fsS "$BASE_URL/assets/backgrounds/omoi-no-hougaku-bg-morning-mist-beige.png" -o /tmp/background.png && test -s /tmp/background.png; then
              background_ok=1
            fi

            if curl -fsS "$BASE_URL/robots.txt" -o /tmp/robots.txt \
              && grep -Fq 'Sitemap: https://omoi-no-hougaku.pages.dev/sitemap.xml' /tmp/robots.txt; then
              robots_ok=1
            fi

            if curl -fsS "$BASE_URL/sitemap.xml" -o /tmp/sitemap.xml \
              && grep -Fq '<loc>https://omoi-no-hougaku.pages.dev/</loc>' /tmp/sitemap.xml; then
              sitemap_ok=1
            fi

            echo "status: build=$build_ok root=$root_ok manifest=$manifest_ok sw=$sw_ok background=$background_ok robots=$robots_ok sitemap=$sitemap_ok no-origin=$no_origin_status resolve-location=$location_status"

            if [ "$build_ok" = '1' ] \
              && [ "$root_ok" = '1' ] \
              && [ "$manifest_ok" = '1' ] \
              && [ "$sw_ok" = '1' ] \
              && [ "$background_ok" = '1' ] \
              && [ "$robots_ok" = '1' ] \
              && [ "$sitemap_ok" = '1' ] \
              && [ "$no_origin_status" = '403' ] \
              && grep -q 'ORIGIN_REQUIRED' /tmp/no-origin.json \
              && [ "$location_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/location-api.json; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'MVP production deployment did not become ready within 60 seconds.'
            echo 'Latest responses:'
            for file in /tmp/build.json /tmp/index.html /tmp/manifest.json /tmp/robots.txt /tmp/sitemap.xml /tmp/sw.js /tmp/no-origin.json /tmp/location-api.json; do
              echo "--- $file ---"
              cat "$file" 2>/dev/null || true
              echo
            done
            exit 1
          fi
