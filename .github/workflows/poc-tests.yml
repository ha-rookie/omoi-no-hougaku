name: PoC tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: omoi-poc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  google-maps-share-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check poc/google-maps-share-link/resolver.mjs
          node --check poc/google-maps-share-link/share-location-resolver.mjs
          node --check poc/google-maps-share-link/sw-share-target.js

          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js
          node --check functions/api/resolve-maps-url.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/places-details.js
          node --check functions/_shared/request-security.js
          node --check functions/_shared/rate-limit-service.js

          node --check workers/api-rate-limiter/src/index.js

          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/assets/app-icon.svg
          test -s public/js/core/shared-location.js
          test -s public/js/core/bearing-engine.js
          test -s public/js/core/heading-normalizer.js
          test -s public/js/core/alignment-engine.js
          test -s public/js/core/map-geometry.js
          test -s public/js/app/direction-session.js
          test -s public/js/app/alignment-transition.js
          test -s public/js/infrastructure/location-provider.js
          test -s public/js/infrastructure/heading-provider.js
          test -s public/js/infrastructure/declination-provider.js
          test -s public/js/vendor/geomagnetism-wmm2025.js
          test -s public/data/wmm-2025.json
          test -s public/licenses/geomagnetism-0.2.0-LICENSE.txt
          test -s public/licenses/THIRD_PARTY_NOTICES.md
          test -s public/js/app/receive-shared-place.js
          test -s public/js/app/register-place.js
          test -s public/js/infrastructure/location-resolver-client.js
          test -s public/js/infrastructure/place-repository.js
          test -s public/js/ui/app-view.js
          test -s public/js/ui/map-overview.js
          test -s public/data/maps/japan-prefectures.geojson
          test -s public/data/maps/world-110m.geojson
          test -s public/licenses/japan-map-selector-LICENSE.txt
          test -s public/licenses/japan-map-selector-ATTRIBUTION.md
          test -s public/licenses/world-atlas-LICENSE.txt

          node --check public/app.js
          node --check public/sw.js
          node --check public/js/core/shared-location.js
          node --check public/js/core/bearing-engine.js
          node --check public/js/core/heading-normalizer.js
          node --check public/js/core/alignment-engine.js
          node --check public/js/core/map-geometry.js
          node --check public/js/app/direction-session.js
          node --check public/js/app/alignment-transition.js
          node --check public/js/infrastructure/location-provider.js
          node --check public/js/infrastructure/heading-provider.js
          node --check public/js/infrastructure/declination-provider.js
          node --check public/js/vendor/geomagnetism-wmm2025.js
          node --check public/js/app/receive-shared-place.js
          node --check public/js/app/register-place.js
          node --check public/js/infrastructure/location-resolver-client.js
          node --check public/js/infrastructure/place-repository.js
          node --check public/js/ui/app-view.js
          node --check public/js/ui/map-overview.js

          node --check tests/request-security.test.mjs
          node --check tests/rate-limiter-worker.test.mjs
          node --check tests/rate-limit-service.test.mjs
          node --check tests/shared-location.test.mjs
          node --check tests/receive-shared-place.test.mjs
          node --check tests/place-repository.test.mjs
          node --check tests/location-resolver-client.test.mjs
          node --check tests/direction-core.test.mjs
          node --check tests/direction-session.test.mjs
          node --check tests/heading-provider.test.mjs
          node --check tests/wmm2025-runtime.test.mjs
          node --check tests/map-geometry.test.mjs
          node --check tests/alignment-transition.test.mjs

          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('public/data/maps/japan-prefectures.geojson','utf8')); if(j.features?.length !== 47) process.exit(1)"
          node -e "const fs=require('fs'); const w=JSON.parse(fs.readFileSync('public/data/maps/world-110m.geojson','utf8')); if(!Array.isArray(w.features) || w.features.length < 100) process.exit(1)"

          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(!m.share_target || m.share_target.method !== 'POST' || m.share_target.action !== '/share-target') process.exit(1)"
          grep -Fq "navigator.serviceWorker.register('/sw.js'" public/app.js
          grep -Fq "requestUrl.pathname === '/share-target'" public/sw.js

          if grep -R -E "from ['\"][^'\"]*poc/|import\(['\"][^'\"]*poc/" public --include='*.js'; then
            echo 'Production code must not import from poc/.'
            exit 1
          fi

          grep -Fq "navigator.serviceWorker.register('/sw-share-target.js'" poc/google-maps-share-link/share-location-poc.html
          grep -Fq "await navigator.serviceWorker.ready" poc/google-maps-share-link/share-location-poc.html

      - name: Run resolver tests
        shell: bash
        run: |
          set -euo pipefail

          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs
          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs
          node tests/share-location-resolver.test.mjs
          node tests/request-security.test.mjs
          node tests/rate-limiter-worker.test.mjs
          node tests/rate-limit-service.test.mjs

          node tests/shared-location.test.mjs
          node tests/receive-shared-place.test.mjs
          node tests/place-repository.test.mjs
          node tests/location-resolver-client.test.mjs
          node tests/direction-core.test.mjs
          node tests/direction-session.test.mjs
          node --test tests/heading-provider.test.mjs
          node --test tests/wmm2025-runtime.test.mjs
          node tests/map-geometry.test.mjs
          node tests/alignment-transition.test.mjs
