<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Google Maps共有リンク Server PoC v2 | 想いの方角</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f5f4; color: #222; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { line-height: 1.7; }
    .badge { display: inline-block; padding: 4px 8px; border: 1px solid #999; border-radius: 999px; font-size: .82rem; font-weight: 700; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 16px; padding: 16px; margin-top: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 112px; padding: 12px; border: 1px solid #bbb; border-radius: 10px; font: inherit; }
    button { width: 100%; margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; }
    .status { font-weight: 700; }
    .muted { color: #666; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">SERVER RESOLVER v2</span>
    <h1>Google Maps共有リンク PoC</h1>
    <p>この画面はブラウザからGoogleへ直接アクセスしません。短縮URLを同一サイトのCloudflare Pages Functionへ送り、サーバー側で一時的に展開します。</p>

    <section class="card">
      <label for="input">Google Mapsの短縮共有リンク</label>
      <textarea id="input" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://maps.app.goo.gl/..."></textarea>
      <button id="resolve" type="button">サーバー経由で地点を読み取る</button>
      <p class="muted">地点は保存しません。Google Maps Platform APIも利用しません。</p>
    </section>

    <section class="card" aria-live="polite">
      <div id="status" class="status">未実行</div>
      <pre id="result">SERVER RESOLVER v2 の結果がここに表示されます。</pre>
    </section>
  </main>

  <script>
    const input = document.querySelector('#input');
    const button = document.querySelector('#resolve');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');

    function normalizeInput(raw) {
      const text = String(raw ?? '').trim();
      const match = text.match(/https:\/\/maps\.app\.goo\.gl\/[^\s]+/i);
      return match ? match[0] : text;
    }

    button.addEventListener('click', async () => {
      const rawUrl = normalizeInput(input.value);
      status.textContent = 'SERVER RESOLVER v2: 読み取り中…';
      result.textContent = '';
      button.disabled = true;

      try {
        const response = await fetch('/api/resolve-map', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          cache: 'no-store',
          credentials: 'same-origin',
          referrerPolicy: 'no-referrer',
          body: JSON.stringify({ url: rawUrl }),
        });

        const text = await response.text();
        let payload;
        try {
          payload = JSON.parse(text);
        } catch {
          throw Object.assign(new Error('API応答がJSONではありません'), {
            code: 'RESOLVER_RESPONSE_INVALID',
            details: { httpStatus: response.status, bodyPreview: text.slice(0, 200) },
          });
        }

        if (!response.ok || !payload?.ok) {
          throw Object.assign(new Error(payload?.error?.message ?? '場所を読み取れませんでした'), {
            code: payload?.error?.code ?? 'RESOLVER_FAILED',
            details: { httpStatus: response.status },
          });
        }

        status.textContent = 'SERVER RESOLVER v2: 読み取り成功';
        result.textContent = JSON.stringify({
          mode: 'server-v2',
          latitude: payload.latitude,
          longitude: payload.longitude,
          sourceType: payload.sourceType,
        }, null, 2);
      } catch (error) {
        status.textContent = 'SERVER RESOLVER v2: 読み取り失敗';
        result.textContent = JSON.stringify({
          mode: 'server-v2',
          name: error?.name ?? 'Error',
          code: error?.code ?? 'UNKNOWN_ERROR',
          message: error?.message ?? String(error),
          details: error?.details ?? {},
        }, null, 2);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
