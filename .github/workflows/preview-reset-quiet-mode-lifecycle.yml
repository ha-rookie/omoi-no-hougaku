name: Preview reset quiet mode lifecycle

on:
  push:
    branches:
      - bugfix/reset-quiet-mode-lifecycle

permissions:
  contents: read

concurrency:
  group: preview-reset-quiet-mode-lifecycle
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/quiet-mode-lifecycle.test.mjs

      - name: Deploy public directory as Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: pages deploy public --project-name=omoi-no-hougaku --branch=bugfix-reset-quiet-mode-lifecycle --commit-dirty=true

      - name: Preview smoke test
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS "$DEPLOYMENT_URL/app.js" -o /tmp/app.js; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -Fq "window.addEventListener('pagehide'" /tmp/app.js
          grep -Fq "window.addEventListener('pageshow'" /tmp/app.js
          grep -Fq "view.resetQuietMode();" /tmp/app.js

      - name: Report preview URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Preview URL: $DEPLOYMENT_URL"
