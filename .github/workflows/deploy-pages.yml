name: Deploy PoC to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'poc/google-maps-share-link/**'
      - 'functions/**'
      - 'tests/**'
      - 'docs/CLOUDFLARE_SETUP.md'
      - 'docs/02_SYSTEM_ARCHITECTURE.md'
      - 'docs/03_APPLICATION_ARCHITECTURE.md'
      - 'docs/adr/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PoC and Function files
        shell: bash
        run: |
          set -euo pipefail
          test -s poc/google-maps-share-link/index.html
          test -s poc/google-maps-share-link/server-poc-v2.html
          test -s poc/google-maps-share-link/resolver.mjs
          test -s poc/google-maps-share-link/share-target-poc.html
          test -s poc/google-maps-share-link/share-location-poc.html
          test -s poc/google-maps-share-link/share-location-resolver.mjs
          test -s poc/google-maps-share-link/share-target-manifest.webmanifest
          test -s poc/google-maps-share-link/sw-share-target.js
          test -s poc/google-maps-share-link/share-target-icon.svg
          test -s poc/google-maps-share-link/resolution-api-poc.html
          test -s poc/google-maps-share-link/location-poc.html
          test -s functions/api/resolve-map.js
          test -s functions/_shared/google-maps-resolver.js
          test -s functions/api/resolve-maps-url.js
          test -s functions/_shared/maps-grounding-resolver.js
          test -s functions/api/resolve-location.js
          test -s functions/_shared/places-details.js
          test -s functions/_shared/request-security.js
          test -s functions/_shared/rate-limit-service.js
          test -s tests/request-security.test.mjs
          test -s tests/rate-limit-service.test.mjs
          node --check poc/google-maps-share-link/resolver.mjs
          node --check poc/google-maps-share-link/share-location-resolver.mjs
          node --check poc/google-maps-share-link/sw-share-target.js
          node --check functions/api/resolve-map.js
          node --check functions/_shared/google-maps-resolver.js
          node --check functions/api/resolve-maps-url.js
          node --check functions/_shared/maps-grounding-resolver.js
          node --check functions/api/resolve-location.js
          node --check functions/_shared/places-details.js
          node --check functions/_shared/request-security.js
          node --check functions/_shared/rate-limit-service.js
          node --check tests/request-security.test.mjs
          node --check tests/rate-limit-service.test.mjs
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('poc/google-maps-share-link/share-target-manifest.webmanifest','utf8')); if(!m.share_target || m.share_target.method !== 'POST') process.exit(1)"

      - name: Run resolver tests
        shell: bash
        run: |
          set -euo pipefail
          node poc/google-maps-share-link/resolver.test.mjs
          node tests/google-maps-server-resolver.test.mjs
          node tests/maps-grounding-resolver.test.mjs
          node tests/places-details.test.mjs
          node tests/share-location-resolver.test.mjs
          node tests/request-security.test.mjs
          node tests/rate-limit-service.test.mjs

      - name: Verify Pages rate limiter service binding
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/omoi-no-hougaku"             -H "Authorization: Bearer $CF_API_TOKEN"             -H 'Content-Type: application/json'             -o /tmp/pages-project.json
          jq -e '
            .success == true and
            .result.deployment_configs.production.services.RATE_LIMITER_SERVICE.service == "omoi-no-hougaku-rate-limiter"
          ' /tmp/pages-project.json >/dev/null

      - name: Write Pages build marker
        shell: bash
        run: |
          printf '{"buildSha":"%s"}\n' "$GITHUB_SHA" > poc/google-maps-share-link/build.json

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          MAPS_GROUNDING_API_KEY: ${{ secrets.MAPS_GROUNDING_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          preCommands: |
            test -n "$MAPS_GROUNDING_API_KEY"
            printf '%s' "$MAPS_GROUNDING_API_KEY" | npx wrangler pages secret put MAPS_GROUNDING_API_KEY --project-name=omoi-no-hougaku
            npx wrangler pages project create omoi-no-hougaku --production-branch main || true
          command: pages deploy poc/google-maps-share-link --project-name=omoi-no-hougaku --branch=main --commit-dirty=true

      - name: Deployment smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          BASE_URL: https://omoi-no-hougaku.pages.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo 'Wrangler did not return deployment-url.'
            exit 1
          fi

          echo "Wrangler deployment URL: $DEPLOYMENT_URL"
          echo "Production smoke target: $BASE_URL"

          ORIGIN="${BASE_URL%/}"
          ready=0
          for attempt in $(seq 1 30); do
            echo "Pages readiness attempt $attempt/30: $BASE_URL"

            no_origin_status="$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-location" \
              -H 'content-type: application/json' \
              --data '{}')" || no_origin_status="000"

            api_status="$(curl -sS -o /tmp/api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-map" \
              -H 'content-type: application/json' \
              -H "Origin: $ORIGIN" \
              -H 'Sec-Fetch-Site: same-origin' \
              --data '{}')" || api_status="000"

            grounding_status="$(curl -sS -o /tmp/grounding-api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-maps-url" \
              -H 'content-type: application/json' \
              -H "Origin: $ORIGIN" \
              -H 'Sec-Fetch-Site: same-origin' \
              --data '{}')" || grounding_status="000"

            location_status="$(curl -sS -o /tmp/location-api.json -w '%{http_code}' \
              -X POST "$BASE_URL/api/resolve-location" \
              -H 'content-type: application/json' \
              -H "Origin: $ORIGIN" \
              -H 'Sec-Fetch-Site: same-origin' \
              --data '{}')" || location_status="000"

            build_ok=0
            if curl -fsS "$BASE_URL/build.json" -o /tmp/build.json; then
              if grep -Fq "\"buildSha\":\"$EXPECTED_BUILD_SHA\"" /tmp/build.json; then
                build_ok=1
              fi
            fi

            root_ok=0
            if curl -fsS "$BASE_URL/" -o /tmp/index.html && grep -q 'Google Maps' /tmp/index.html; then
              root_ok=1
            fi

            echo "status: build=$build_ok root=$root_ok no-origin=$no_origin_status resolve-map=$api_status resolve-maps-url=$grounding_status resolve-location=$location_status"

            if [ "$build_ok" = '1' ] \
              && [ "$root_ok" = '1' ] \
              && [ "$no_origin_status" = '403' ] \
              && grep -q 'ORIGIN_REQUIRED' /tmp/no-origin.json \
              && [ "$api_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/api.json \
              && [ "$grounding_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/grounding-api.json \
              && [ "$location_status" = '400' ] \
              && grep -q 'URL_REQUIRED' /tmp/location-api.json; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'PoC production deployment did not become ready within 60 seconds.'
            echo 'Latest responses:'
            for file in /tmp/build.json /tmp/index.html /tmp/no-origin.json /tmp/api.json /tmp/grounding-api.json /tmp/location-api.json; do
              echo "--- $file ---"
              cat "$file" 2>/dev/null || true
              echo
            done
            exit 1
          fi
