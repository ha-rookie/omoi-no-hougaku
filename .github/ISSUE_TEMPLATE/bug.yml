name: Bug
description: 不具合の再現・原因・回復を管理する
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 事象
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 証跡
      description: Screenshot、ログ、CI run、URL、Branch、commit SHA
  - type: dropdown
    id: category
    attributes:
      label: 原因分類
      options:
        - 未確認
        - Code
        - Test
        - Build
        - Git / PR
        - Cloudflare設定
        - Binding / Secret
        - Asset
        - 外部サービス
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: 回避策・復旧手順
  - type: textarea
    id: acceptance
    attributes:
      label: 修正の受け入れ条件
    validations:
      required: true
